    Od střední školy jsem prošel stážemi na Astronomickém ústavu a Fyzikálním ústavu
    AV ČR. K vědě patří i její sdílení: vedl jsem astronomický kroužek, natáčel
    popularizační přednášky a každé léto jezdím jako vedoucí na astronomický tábor.
  en: >-
    I study physics at the Faculty of Mathematics and Physics, Charles University (Prague).
    I enjoy the place where physics meets programming: kinetic Monte Carlo simulations of
    thin-film growth, numerical solutions of quantum-mechanical problems, and astronomical
    data processing. Since secondary school I have done research internships at the
    Astronomical Institute and the Institute of Physics of the Czech Academy of Sciences.
    Sharing science matters to me too: I ran an astronomy club, recorded public lectures,
    and every summer I work as a leader at an astronomy camp.

