featured_projects:

  - slug: kmc-sapphire
    title:
      cs: "Kinetické Monte Carlo: růst safíru"
      en: "Kinetic Monte Carlo: sapphire growth"
    period: "02/2026 – "
    org:
      cs: "Studentský fakultní grant (SFG), Katedra fyziky povrchů a plazmatu MFF UK"
      en: "Student Faculty Grant (SFG), Dept. of Surface and Plasma Science, Charles University"
    supervisor: "doc. RNDr. Pavel Kocán, Ph.D."
    tags: [Python, Numba, kMC, "thin films", "PLD"]
    summary:
      cs: "Simulace růstu tenkých vrstev safíru (α-Al₂O₃) pulzní laserovou depozicí na úrovni jednotlivých atomů, včetně příměsí s laditelnými energiemi."
      en: "Atom-by-atom simulation of sapphire (α-Al₂O₃) thin-film growth by pulsed laser deposition, including dopants with tunable energetics."
    body:
      cs:
        - "Napsal jsem kinetickou Monte Carlo simulaci růstu safíru (korundu) při pulzní laserové depozici (PLD) na zkosené hexagonální mřížce s implicitní kyslíkovou podmřížkou. Simulace běží jako automatizovaná pipeline: simulace → strukturní vyhodnocení (koordinace, obsazenost) → grafy pokrytí v čase a 3D export."
        - "Do modelu jsem implementoval i jiné kationty (dopanty), jejichž vazebné energie a difuzní bariéry lze ladit, takže je možné studovat, jak ovlivňují morfologii vrstvy, například zda se dopanty shlukují."
        - "Simulace je napsaná v Pythonu (hlavní smyčky kompilované přes Numba) a v řádu hodin zvládne mřížky kolem 500 × 500 a tisíce vrstev."
      en:
        - "I wrote a kinetic Monte Carlo simulation of sapphire (corundum) growth by pulsed laser deposition (PLD) on a sheared hexagonal lattice with an implicit oxygen sublattice. It runs as an automated pipeline: simulation → structural evaluation (coordination, occupancy) → coverage-vs-time plots and 3D export."
        - "I added other cations (dopants) whose binding energies and diffusion barriers can be tuned, so one can study how they change the film morphology, e.g. whether dopants cluster."
        - "The code is Python (hot loops JIT-compiled with Numba) and handles grids of about 500 × 500 with thousands of layers within hours."
    results:
      - { cs: "Funkční kMC model růstu safíru s dopanty a laditelnými energiemi", en: "Working kMC model of sapphire growth with tunable dopant energetics" }
      - { cs: "Velké běhy: ~500 × 500 mřížka, tisíce vrstev, jednotky hodin", en: "Large runs: ~500 × 500 grid, thousands of layers, a few hours" }
      - { cs: "Trend: silnější Ehrlichova–Schwoebelova bariéra dopantu → dopanty se shlukují", en: "Trend: a stronger dopant Ehrlich–Schwoebel barrier → dopants cluster" }
    caveat:
      cs: "Energetické parametry zatím nejsou odvozené z měření (experimentální data nejsou k dispozici), fyzikálně smysluplné jsou proto hlavně trendy, ne absolutní hodnoty."
      en: "The energetic parameters are not yet derived from measurement (no experimental data are available), so it is the trends that are physically meaningful, not the absolute numbers."
    visualization: kmc-crystal          # data: /data/kmc-t10-crystal.json
    links: []                           # repozitář je soukromý
    cv: true

  - slug: deuteron
    title:
      cs: "Deuteron: numerické řešení vázaného stavu"
      en: "The deuteron: numerical bound-state solution"
    period: "01/2024 – 11/2024"
    org:
      cs: "Stáž Otevřená věda, Fyzikální ústav AV ČR"
      en: "Open Science internship, Institute of Physics of the Czech Academy of Sciences"
    supervisor: "Ing. Martin Schäfer, Ph.D."
    tags: [Python, NumPy, SciPy, Numerov, "nuclear physics"]
    award:
      cs: "2. místo na konferenci Otevřené vědy 2024"
      en: "2nd place, Open Science conference 2024"
    summary:
      cs: "Program, který popisuje deuteron jako vázaný stav protonu a neutronu se složkou s-vlny i d-vlny, a z vlnové funkce počítá jeho vlastnosti."
      en: "A program describing the deuteron as a proton–neutron bound state with both s-wave and d-wave components, computing its properties from the wave function."
    body:
      cs:
        - "Deuteron je nejjednodušší atomové jádro. Tenzorová složka jaderné síly v něm míchá s-vlnu (l = 0) a d-vlnu (l = 2), takže radiální Schrödingerova rovnice se stává soustavou dvou vázaných rovnic."
        - "Napsal jsem maticovou Numerovovu metodu pro vázané kanály s realistickým potenciálem (centrální, tenzorová a spin-orbitální část). Vazebnou energii hledám podmínkou navázání řešení integrovaných zvenku a zevnitř, z normované vlnové funkce pak počítám další vlastnosti deuteronu."
        - "Na stáži jsem metody použil i na fázové posuny nukleon-nukleonového rozptylu a na spektra kvarkonií (exotických mezonů)."
      en:
        - "The deuteron is the simplest nucleus. The tensor part of the nuclear force mixes the s-wave (l = 0) and the d-wave (l = 2), so the radial Schrödinger equation becomes two coupled equations."
        - "I implemented a matrix Numerov method for coupled channels with a realistic potential (central, tensor and spin–orbit parts). The binding energy is found by matching the outward and inward solutions; the normalized wave function then gives further properties of the deuteron."
        - "During the internship I also applied the methods to nucleon–nucleon scattering phase shifts and to quarkonium (exotic meson) spectra."
    results:
      - { cs: "Vazebná energie −2,23 MeV (experiment −2,2246 MeV)", en: "Binding energy −2.23 MeV (experiment −2.2246 MeV)" }
      - { cs: "Vlnová funkce se složkami s- a d-vlny", en: "Wave function with s- and d-wave components" }
      - { cs: "Pravděpodobnost d-stavu P_D ≈ 6,5 %", en: "D-state probability P_D ≈ 6.5 %" }
      - { cs: "Poloměr (rms) ≈ 1,92 fm (experiment 1,97 fm), kvadrupólový moment Q ≈ 0,274 fm² (experiment 0,286 fm²)", en: "RMS radius ≈ 1.92 fm (experiment 1.97 fm), quadrupole moment Q ≈ 0.274 fm² (experiment 0.286 fm²)" }
    visualization: deuteron-wavefunction   # data: /data/deuteron.json
    links: []
    cv: true

  - slug: afm-stm
    title:
      cs: "Interaktivní simulace STM a FM-AFM"
      en: "Interactive STM & FM-AFM simulation"
    period: "09/2026"
    org:
      cs: "Letní studentský projekt KFPP 2026, MFF UK"
      en: "KFPP Summer Student Project 2026, Charles University"
    supervisor: "doc. RNDr. Pavel Kocán, Ph.D."
    tags: [Python, Pyodide, JupyterLite, "control loops", "SPM"]
    summary:
      cs: "Výuková simulace zpětnovazební smyčky rastrovacího tunelového mikroskopu a mikroskopu atomárních sil, ovládaná posuvníky přímo v prohlížeči."
      en: "A teaching simulation of the feedback loop of a scanning tunnelling microscope and an atomic force microscope, controlled with sliders directly in the browser."
    body:
      cs:
        - "Simulace zpětnovazební smyčky STM (režim konstantního proudu) a frekvenčně modulovaného AFM (qPlus senzor). Místo úprav kódu se ovládá posuvníky: P / I / PI regulátor, různé povrchy, šum škálovaný z naměřených hodnot, režim konstantního proudu vs. konstantní výšky."
        - "AFM část počítá sílu F(d) a posun frekvence Δf(d) se stabilní větví, rezonanci a fázi, včetně ztráty stability za minimem Δf. Kombinovaný režim STM + AFM s jedním oscilujícím vodivým hrotem."
        - "Python běží přímo v prohlížeči (JupyterLite / Pyodide), rozhraní je česky i anglicky a ke každému parametru je uvedeno, odkud jeho hodnota pochází."
      en:
        - "A simulation of the feedback loop of an STM (constant-current mode) and a frequency-modulation AFM (qPlus sensor). It is controlled with sliders instead of code edits: P / I / PI controller, different surfaces, noise scaled from measured values, constant-current vs. constant-height mode."
        - "The AFM part computes the force F(d) and the frequency shift Δf(d) with the stable branch, resonance and phase, including the loss of stability beyond the Δf minimum. A combined STM + AFM mode uses one oscillating conducting tip."
        - "Python runs directly in the browser (JupyterLite / Pyodide); the interface is in Czech and English and every parameter states where its value comes from."
    results:
      - { cs: "Veřejné interaktivní demo běžící v prohlížeči", en: "Public interactive demo running in the browser" }
      - { cs: "Testy ověřující fyziku i shodu panelů s dávkovými skripty", en: "Tests checking the physics and that the panels match the batch scripts" }
    visualization: stm-tip-animation
    links:
      - { label: { cs: "Spustit demo", en: "Launch the demo" }, url: "https://lukashrdy11.github.io/afm-stm-demo/", primary: true }
      - { label: { cs: "Zdrojový kód", en: "Source code" }, url: "https://github.com/LukasHrdy11/afm-stm-demo" }
    cv: true

  - slug: ephemerides
    title:
      cs: "Výpočet poloh nebeských těles"
      en: "Computing positions of celestial bodies"
    period: "09/2022 – 06/2023"
    org:
      cs: "Středoškolská odborná činnost (obor fyzika), Hvězdárna Zlín"
      en: "Secondary-school research competition SOČ (physics), Zlín Observatory"
    supervisor: "Ing. Vratislav Zíka"
    tags: ["celestial mechanics", "Kepler's equation", "Pascal"]
    award:
      cs: "3. místo v SOČ, obor fyzika (2023)"
      en: "3rd place, SOČ physics (2023)"
    summary:
      cs: "Vlastní program pro predikci poloh planet a komet z dráhových elementů, včetně parabolických a hyperbolických drah."
      en: "My own program predicting positions of planets and comets from orbital elements, including parabolic and hyperbolic orbits."
    body:
      cs:
        - "Program z dráhových elementů řeší Keplerovu rovnici a počítá efemeridy: rektascenzi, deklinaci, vzdálenosti od Země a Slunce a elongaci. Zvládá eliptické, parabolické i hyperbolické dráhy, třeba kometu C/2017 K2 (PANSTARRS)."
        - "Interaktivní Sluneční soustava v úvodu tohoto webu počítá polohy planet stejným principem a kometa C/2017 K2 v ní letí po dráze z mých vstupních dat."
      en:
        - "From orbital elements the program solves Kepler's equation and computes ephemerides: right ascension, declination, distances from Earth and Sun, and elongation. It handles elliptic, parabolic and hyperbolic orbits, e.g. comet C/2017 K2 (PANSTARRS)."
        - "The interactive Solar System at the top of this site computes planetary positions on the same principle, and comet C/2017 K2 flies along the orbit from my input data."
    results:
      - { cs: "3. místo v SOČ (fyzika)", en: "3rd place in SOČ (physics)" }
      - { cs: "Eliptické, parabolické i hyperbolické dráhy", en: "Elliptic, parabolic and hyperbolic orbits" }
    visualization: hero-solar-system     # odkaz na úvodní 3D vizualizaci
    links:
      - { label: { cs: "Stáhnout práci SOČ (PDF, česky)", en: "Download the SOČ thesis (PDF, Czech)" }, url: "/media/soc-vypocet-poloh-nebeskych-teles.pdf", primary: true }
    cv: true

